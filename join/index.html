<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>フレンドたいせんの招待｜ぱれっとすとあ</title>
<link rel="canonical" href="https://palettestore.crois-studio.com/join">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/site.css">
<script defer src="/join/invite.js"></script>
</head>
<body class="join">
<main>
  <nav class="langnav" id="languages" hidden>
    <a href="#ja" lang="ja">日本語</a> ·
    <a href="#en" lang="en">English</a> ·
    <a href="#zh-Hans" lang="zh-Hans">简体中文</a> ·
    <a href="#zh-Hant" lang="zh-Hant">繁體中文</a> ·
    <a href="#ko" lang="ko">한국어</a> ·
    <a href="#es" lang="es">Español</a> ·
    <a href="#fr" lang="fr">Français</a> ·
    <a href="#de" lang="de">Deutsch</a> ·
    <a href="#pt-BR" lang="pt-BR">Português</a>
  </nav>
  <header>
    <h1 id="title">フレンドたいせんの招待</h1>
    <p class="lead" id="app">ぱれっとすとあ</p>
  </header>
  <div class="card invite-card" id="invite" hidden>
    <label for="room-code" id="code-label"></label>
    <input id="room-code" class="room-code" type="text" readonly dir="ltr" spellcheck="false">
    <button class="action" type="button" id="copy" hidden></button>
    <p class="feedback" id="feedback" role="status"></p>
    <p id="instructions"></p>
    <p class="expiry" id="expiry"></p>
  </div>
  <div class="card invite-card" id="invalid" hidden>
    <p id="invalid-message"></p>
    <p id="invalid-help"></p>
  </div>
  <div class="stores" id="stores" hidden>
    <a class="action" id="app-store" rel="noreferrer" hidden>App Store</a>
    <a class="action" id="google-play" rel="noreferrer" hidden>Google Play</a>
  </div>
  <noscript><p>あいことばを表示するには、JavaScript をオンにしてね。</p></noscript>
</main>
</body>
</html>
